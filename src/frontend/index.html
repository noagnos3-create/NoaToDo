<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Content Security Policy (Bauplan B.9 Regel 2), Defense-in-Depth gegen
       XSS/RCE. 'unsafe-inline' NUR fuer style-src (das Frontend nutzt
       inline style=""-Attribute), NICHT fuer script-src: damit bleiben
       eingeschleuste Inline-Handler (z.B. <img onerror=...>) wirkungslos,
       selbst wenn doch einmal innerHTML mit Fremddaten benutzt wird. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoaToDo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="root">
    <div class="boot">Unpacking vault…</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
