<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Content Security Policy (Bauplan B.9 Regel 2), Defense-in-Depth gegen
       Sync-XSS/RCE. 'unsafe-inline' NUR fuer style-src (das Frontend nutzt
       inline style=""-Attribute), NICHT fuer script-src: damit bleiben
       eingeschleuste Inline-Handler (z.B. <img onerror=...> aus MS-Graph-Daten)
       wirkungslos, selbst wenn doch einmal innerHTML mit Fremddaten benutzt wird. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoaToDo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- TEMPORAERER DIAGNOSE-MARKER (wieder entfernen): liegt ausserhalb von #root,
       wird also vom render() nicht ueberschrieben. Sichtbar = neuer Code laeuft. -->
  <div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#d92626;color:#fff;
              font:700 14px/1.6 monospace;text-align:center;padding:6px;letter-spacing:1px;">
    BUILD-MARKER 20:58, wenn du das siehst, laeuft der NEUE Code
  </div>
  <div class="app" id="root">
    <div class="boot">Unpacking vault…</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
